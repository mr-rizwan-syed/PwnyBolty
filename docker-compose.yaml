services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    volumes:
      - ./static:/app/static
      - ./logs:/logs
      - ./build:/app/static/build
      - ./data:/app/data
    restart: unless-stopped
    container_name: caddy-main
    ports:
      - "127.0.0.1:8080:80"
